name: cicd

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]


env:
  FLUTTER_MIN_VERSION: '3.47.0'

jobs:
  # BEGIN LINTING STAGE
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
      - uses: bluefireteam/melos-action@v3
      - run: melos run format-check

  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{env.FLUTTER_MIN_VERSION}}
      - uses: bluefireteam/melos-action@v3
      - name: "Analyze with lowest supported version"
        uses: invertase/github-action-dart-analyzer@v3
        with:
          fatal-infos: true

  analyze-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
      - uses: bluefireteam/melos-action@v3
      - name: "Analyze with latest stable"
        uses: invertase/github-action-dart-analyzer@v3
        with:
          fatal-infos: true

  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g markdownlint-cli@~0.49.0
      - run: markdownlint . -p .markdownlintignore -c .markdownlint.yaml

  dcm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
      - uses: bluefireteam/melos-action@v3
      - name: Install DCM
        uses: CQLabs/setup-dcm@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run DCM
        run: dcm analyze .
  # END LINTING STAGE

  # BEGIN TESTING STAGE
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          cache: true
      - uses: bluefireteam/melos-action@v3
      - name: Run tests
        run: melos run test:select --no-select

  goldens:
    # golden-env needs an x86-64 runner, ARM would render differently.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # flame_forge2d is left out: forge2d builds native assets, and the
        # image has no C toolchain, so its goldens still run in `test`.
        package:
          - packages/flame
          - packages/flame_sprite_fusion
          - packages/flame_steering_behaviors
          - packages/flame_svg
          - packages/flame_test
          - packages/flame_test/example
          - packages/flame_tiled
    steps:
      - uses: actions/checkout@v7
      - name: Run golden tests
        uses: albert221/golden-env@v1
        with:
          working-directory: ${{ matrix.package }}
          # The action's artifact name is fixed, so it would collide between
          # matrix jobs; failures are uploaded below instead.
          upload-failures: false
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures-${{ strategy.job-index }}
          path: ${{ matrix.package }}/**/failures/**
          if-no-files-found: ignore
  # END TESTING STAGE
